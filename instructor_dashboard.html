<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QU Student Management - Instructor Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="scripts/app.js" defer></script>
</head>

<body>
  <header>
    <nav class="navbar">
      <a href="main.html" class="logo">QU Student Management</a>
      <ul class="nav-links">
        <li><a href="instructor_dashboard.html" class="active">Instructor Dashboard</a></li>
        <li><a href="login.html" class="btn-logout">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="instructor-section">
      <h2>Instructor Dashboard</h2>
      <div class="classes-overview">
        <h3>My Current Classes</h3>
        <table>
          <thead>
            <tr>
              <th>Course</th>
              <th>Class ID</th>
              <th>Number of Students</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="instructorClassesTable">
            <tr>
              <td>Web Development</td>
              <td>Class #123</td>
              <td>25</td>
              <td><button>Submit Grades</button></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="grades-submission">
        <h3>Grades Submission</h3>
        <table id="gradeSubmissionTable">
          <thead>
            <tr>
              <th>Student ID</th>
              <th>Name</th>
              <th>Final Grade</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>20112345</td>
              <td>John Doe</td>
              <td><input type="text" placeholder="A, B+, etc." /></td>
            </tr>
          </tbody>
        </table>
        <button id="submitGradesBtn">Submit Grades</button>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 CSE Department - Qatar University</p>
  </footer>
</body>

</html>
