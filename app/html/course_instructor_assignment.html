<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QU Student Management - Course-Instructor Assignment</title>
  <link rel="stylesheet" href="../styles/styles.css" />
  <script src="scripts/app.js" defer></script>
</head>

<body>
  <header>
    <nav class="navbar">
      <a href="main.html" class="logo">QU Student Management</a>
      <ul class="nav-links">
        <li><a href="admin_dashboard.html">Admin Dashboard</a></li>
        <li><a href="login.html" class="btn-logout">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="assignment-section">
      <h2>Course-Instructor Assignment</h2>
      <div class="assignment-list">
        <h3>Open Courses</h3>
        <ul id="openCourses">
          <li>Web Development (CMPS 350)</li>
        </ul>
      </div>

      <div class="preferences">
        <h3>Instructor Preferences</h3>
        <table>
          <thead>
            <tr>
              <th>Instructor</th>
              <th>Interested Courses</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="instructorsPreferences">
            <tr>
              <td>Dr. Smith</td>
              <td>Web Development, Java</td>
              <td><button>Assign</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 CSE Department - Qatar University</p>
  </footer>
</body>

</html>
