<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QU Student Management</title>
    <link rel="stylesheet" href="../styles/loginStyle.css" />
    <script src="../scripts/login.js" type="module" defer></script>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  </head>

  <body>
    <header>
      <div class="logo-title">
        <div class="logo-img">
          <img src="../img/QU logo.png" alt="Qatar University logo" />
        </div>
        <h1>QU <span>Student Management</span></h1>
      </div>

    </header>

    <main>
      <div class="login-wrapper">
        <blockquote class="login-quote">
          “Education is the most powerful weapon which you can use to change the world.”<br />
          <span>- Nelson Mandela</span>
        </blockquote>
    
        <div class="login-container">
          <form id="login-Form">
            <h2>Welcome back</h2>
    
            <div class="input-group">
              <label for="username"><i class="bx bxs-user"></i> Username</label>
              <input type="text" name="username" class="input-user-username" placeholder="e.g. johndoe" required />
            </div>
    
            <div class="input-group">
              <label for="password"><i class="bx bxs-lock-alt"></i> Password</label>
              <input type="password" name="password" class="input-user-password" placeholder="Your secret password" required />
            </div>
    
            <button type="submit" class="login-btn">Login</button>
            <p class="redirect-msg">Don't have an account? <a href="#">Contact Admin</a></p>
          </form>
        </div>
      </div>
    </main>
    
    <footer>
      <p>&copy; 2025 CSE Department - Qatar University</p>
    </footer>
  </body>
</html>
