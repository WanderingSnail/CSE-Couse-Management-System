<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QU Student Management - Course Validation</title>
  <link rel="stylesheet" href="../styles/mainStyle.css" />
</head>

<body>
  <header>
    <div class="logo-img">
      <img src="../img/QU logo.png" alt="Qatar University logo" width="100%" />
    </div>
    <nav class="navbar">
      <a href="main.html" class="logo">QU Student Management</a>
      <ul class="nav-links">
        <li><a href="schedule.html">Courses Schedule</a></li>
        <li><a href="#" id="showCourseBtn">Create Course</a></li>
        <li><a href="#" id="showClassBtn">Create Class</a></li>
        <li><a href="login.html" class="btn-logout">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Instructor Preferences</h2>
    <table id="coursesTable">
      <thead>
        <tr>
          <th>Course Details</th>
          <th>Instructor</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="courseListTbody"></tbody>
    </table>
  </main>

  <footer>
    <p>&copy; 2025 CSE Department - Qatar University</p>
  </footer>
</body>

</html>

<script type="module">
  import { Instructor } from "../scripts/class/instructor.js";
  import { Class } from "../scripts/class/class.js";

  document.addEventListener("DOMContentLoaded", async () => {
    const preferencesTable = document.getElementById("courseListTbody");

    const instructors = await Instructor.load();
    const classes = await Class.load();
    const preferences = JSON.parse(localStorage.getItem("instructor-preferences")) || [];

    if (preferences.length === 0) {
      preferencesTable.innerHTML = `<tr><td colspan="3">No instructor preferences found.</td></tr>`;
      return;
    }

    preferences.forEach(pref => {
      (pref.interestedCourses || []).forEach(courseString => {
        const [courseId, ...rest] = courseString.split(" ");
        const classId = rest.pop();
        const courseName = rest.join(" ");

        const tr = document.createElement("tr");

        const tdCourse = document.createElement("td");
        tdCourse.textContent = `${courseId} - ${courseName} (${classId})`;
        tr.appendChild(tdCourse);

        const tdInstructor = document.createElement("td");
        tdInstructor.textContent = pref.name;
        tr.appendChild(tdInstructor);

        const tdAction = document.createElement("td");

        const assignBtn = document.createElement("button");
        assignBtn.textContent = "Approve";
        assignBtn.className = "btn-validate";

        assignBtn.addEventListener("click", async () => {
          const allClasses = await Class.load();
          const targetClass = allClasses.find(c =>
            c.classId === classId && c.courseId === courseId
          );

          if (!targetClass) {
            alert("Class not found.");
            return;
          }

          targetClass.instructors = pref.name;

          targetClass.status = "inProgress";

          await Class.save(allClasses);

          const instructor = instructors.find(i => i.id === pref.id);
          if (instructor) {
            instructor.assignedCourses = instructor.assignedCourses || [];

            const already = instructor.assignedCourses.some(
              entry => entry.classId === targetClass.classId
            );

            if (!already) {
              instructor.assignedCourses.push({
                courseId: targetClass.courseId,
                classId: targetClass.classId
              });

              await Instructor.save(instructors);
            }
          }

          alert(`${pref.name} assigned to ${courseId} (${classId})`);
          tr.remove();
        });

        const rejectBtn = document.createElement("button");
        rejectBtn.textContent = "Reject";
        rejectBtn.className = "btn-cancel";

        rejectBtn.addEventListener("click", () => {
          const preferences = JSON.parse(localStorage.getItem("instructor-preferences")) || [];

          const updatedPreferences = preferences.map(p => {
            return {
              ...p,
              interestedCourses: p.interestedCourses.filter(entry =>
                entry !== `${courseId} ${courseName} ${classId}`
              )
            };
          }).filter(p => p.interestedCourses.length > 0);

          localStorage.setItem("instructor-preferences", JSON.stringify(updatedPreferences, null, 2));
          alert(`Rejected ${pref.name}'s interest in ${courseId} - ${courseName} (${classId})`);
          tr.remove();
        });

        tdAction.appendChild(assignBtn);
        tdAction.appendChild(rejectBtn);
        tr.appendChild(tdAction);

        preferencesTable.appendChild(tr);
      });
    });
  });
</script>
