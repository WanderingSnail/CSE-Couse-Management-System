<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QU Student Management - Login</title>
    <link rel="stylesheet" href="../styles/st.css" />
    <script src="scripts/app.js" defer></script>
  </head>

  <body>
    <header>
      <nav class="nav">
      <div class="logo-title">
        <div class="logo-img">
          <img
          src="../img/QU logo.png"
          alt="Qatar University logo"
          height="100%"
          width="100%"
          />
        </div>
        <h1> <a href="main.html" class="header-title"><span>QU Student Management system </span></h1>
        </a>
      </div>
        <ul class="nav-ul">
          <li><a href="student_learning_path.html">Veiw Learning Path</a></li>
          <li><a href="login.html" class="logout-btn">Logout</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="course-search">
        <h2>Available Courses</h2>
        <div class="search-bar">
          <input
            type="text"
            id="searchByName"
            placeholder="Search by course name..."
          />
          <label for="searchByCategory">Category:</label>
          <select id="searchByCategory">
            <option value="">All Categories</option>
            <option value="Programming">Programming</option>
            <option value="Databases">Databases</option>
            <option value="AI">AI</option>
          </select>
          <button id="searchBtn">Search</button>
        </div>
      </div>
    </main>

    <footer>
      <p>&copy; 2025 CSE Department - Qatar University</p>
    </footer>
  </body>
</html>
