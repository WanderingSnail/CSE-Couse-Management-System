<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QU Student Management - Grading</title>
  <link rel="stylesheet" href="../styles/instructorGrading.css" />
  <script src="../scripts/grading.js" type="module"></script>
</head>

<body>
  <header>
    <div class="logo-img">
      <img src="../img/QU logo.png" alt="Qatar University logo" width="100%" />
    </div>
    <nav class="navbar">
      <a href="main.html" class="logo">QU Student Management</a>
      <ul class="nav-links">
        <li><a href="instructor_dashboard.html" class="active">Instructor Dashboard</a></li>
        <li><a href="login.html" class="btn-logout">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="instructor-section">
      <h2>Instructor Grading</h2>

      <div class="selection-container">
        <label for="courseSelect">Select Course:</label>
        <select id="courseSelect">
          <!-- Inject from JSON into here -->
          <option value="web-dev" selected>Web Development</option>
          <option value="ai">Artificial Intelligence</option>
        </select>

        <label for="classSelect">Select Class:</label>
        <select id="classSelect">
          <!-- Inject from JSON into here based on value of course above-->
          <option value="class123" selected>Class #123</option>
          <option value="class124">Class #124</option>
        </select>
      </div>

      <div class="grades-submission">
        <table>
          <thead>
            <tr>
              <th>Student ID</th>
              <th>Name</th>
              <th>Final Grade</th>
            </tr>
          </thead>
          <tbody>
            <!-- Inject from JSON into here -->
            <tr>
              <td>20112345</td>
              <td>John Doe</td>
              <td><input type="text" class="grade-input" placeholder="A, B+, etc." /></td>
            </tr>
            <tr>
              <td>20112346</td>
              <td>Jane Smith</td>
              <td><input type="text" class="grade-input" placeholder="A, B+, etc." /></td>
            </tr>
          </tbody>
        </table>
        <div class="submit-container">
          <button id="submitGradesBtn" class="btn-action">Submit Grades</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 CSE Department - Qatar University</p>
  </footer>
</body>

</html>
