<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QU Student Management - Courses</title>
  <link rel="stylesheet" href="../styles/mainStyle.css" />
  <script src="..\scripts\main.js" type="module" defer></script>
</head>

<body>
  <header>
    <div class="logo-img">
      <img src="../img/QU logo.png" alt="Qatar University logo" width="100%"/>
    </div>
    <nav class="navbar">
      <a href="main.html" class="logo">QU Student Management</a>
      <ul class="nav-links">
        <li><a href="student_learning_path.html">My Learning Path</a></li>
        <li><a href="login.html" class="btn-logout">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="course-search">
      <h2>Available Courses</h2>
      <div class="search-bar">
        <input type="text" id="searchByName" placeholder="Search by course name..." />
        <label for="searchByCategory"></label>
        <select id="searchByCategory">qw
          <option value="">All Categories</option>
          <option value="Programming">Programming</option>
          <option value="Computing Systems">Computing Systems</option>
          <option value="Software Engineering">Software Engineering</option>
          <option value="Security">Security</option>
          <option value="Project">Project</option>
        </select>
        <button id="searchBtn">Search</button>
      </div>

      <div class="courses-container">
        <table id="coursesTable">
          <thead>
            <tr>
              <th>Select</th>
              <th>Course ID</th>
              <th>Course Name</th>              
              <th>Category</th>
              <th>Class</th>
              <th>Instructor</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody>
            <tr class="course-row">
              <td>
                <label>
                  <input type="checkbox" class="course-checkbox" value="course1">
                </label>
              </td>
              <td>Programming Concept</td>
              <td>Programming</td>
              
            </tr>
          </tbody>
        </table>
      </div>

      <div class="register-button-container">
        <button id="registerBtn" class="btn-register">Check Availability</button>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 CSE Department - Qatar University</p>
  </footer>
</body>

</html>
