<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QU Student Management - Course Validation</title>
  <link rel="stylesheet" href="../styles/mainStyle.css" />
</head>

<body>
  <header>
    <div class="logo-img">
      <img src="../img/QU logo.png" alt="Qatar University logo" width="100%" />
    </div>
    <nav class="navbar">
      <a href="main.html" class="logo">QU Student Management</a>
      <ul class="nav-links">
        <li><a href="schedule.html">Courses Schedule</a></li>
        <li><a href="schedule.html">Assign Instructors</a></li>
        <li><a href="login.html" class="btn-logout">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="course-validation">
      <div class="courses-container">
        <table id="coursesTable">
          <thead>
            <tr>
              <th>Course Name</th>
              <th>Category</th>
              <th>Status</th>
              <th>Registered Students</th>
              <th>Classes</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
          <tbody>
            <!-- Inject from JSON into here -->
            <tr class="course-row">
              <td>Data Science 101</td>
              <td>Technology</td>
              <td class="status-open">Open for Registration</td>
              <td>18</td>
              <td>
                <select class="class-dropdown">
                  <option>Class #123</option>
                  <option>Class #124</option>
                </select>
              </td>
              <td>
                <button class="btn-validate">Validate</button>
                <button class="btn-cancel">Cancel</button>
              </td>
            </tr>
            <tr class="course-row">
              <td>Machine Learning Basics</td>
              <td>AI</td>
              <td class="status-in-progress">In Progress</td>
              <td>25</td>
              <td>
                <select class="class-dropdown">
                  <option>Class A</option>
                </select>
              </td>
              <td>-</td>
            </tr>
          </tbody>

          </tbody>
        </table>
      </div>

      <!-- Save into JSON -->
      <form action="#" method="post" class="course-form">
        <h3>Create New Class</h3>
        <div class="form-group">
          <label>Course Name:</label>
          <input type="text" name="course_name" required>
        </div>
        <div class="form-group">
          <label>Category:</label>
          <input type="text" name="category" required>
        </div>
        <div class="form-group">
          <label>Class:</label>
          <input type="text" name="class" required>
        </div>
        <div class="form-group">
          <button type="submit" class="btn-submit">Create Course</button>
        </div>
      </form>

    </section>
  </main>

  <footer>
    <p>&copy; 2025 CSE Department - Qatar University</p>
  </footer>
</body>

</html>
